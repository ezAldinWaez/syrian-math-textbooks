name: إصدار الكتب

on:
  push:
    branches: [main]
    paths:
      - 'books/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: books-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          lfs: false
          persist-credentials: false

      - name: تجهيز حزم الكتب
        shell: bash
        run: |
          shopt -s nullglob
          books=(books/grade-[0-9][0-9]/*/part-*/book.md)
          if [[ ${#books[@]} -eq 0 ]]; then
            echo 'لم يُعثر على كتب في مجلد books.'
            exit 1
          fi

          mkdir -p release
          for book in "${books[@]}"; do
            folder="${book%/*}"
            slug="${folder#books/}"
            paths=(book.md INDEX.md)
            if [[ -d "$folder/images" ]]; then
              paths+=(images)
            fi
            git archive --format=zip --output="release/${slug//\//-}.zip" \
              "HEAD:$folder" -- "${paths[@]}"
          done

      - name: تحديث إصدار الكتب على GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: books
          RELEASE_TITLE: كتب الرياضيات السورية
          RELEASE_NOTES: |
            كتب الرياضيات المدرسية السورية بصيغة Markdown. لكل جزء حزمة ZIP تضم نص الكتاب وفهرسه ورسومه.

            أرفق حزمة الجزء المطلوب بالنموذج اللغوي أو الوكيل. ابدأ بـ `INDEX.md` لتحديد موضع القراءة في `book.md`.
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --latest
          else
            gh release create "$RELEASE_TAG" release/*.zip --target "$(git rev-parse HEAD)" \
              --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --latest
          fi
